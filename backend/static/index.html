<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PM MVP Backend</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f4f5f7; color: #1f2937; margin: 0; padding: 40px; }
      main { max-width: 720px; margin: 0 auto; background: #ffffff; border-radius: 20px; padding: 36px; box-shadow: 0 24px 48px rgba(15, 23, 42, 0.08); }
      h1 { margin-top: 0; color: #032147; }
      p { line-height: 1.6; }
      code { background: #eef2ff; padding: 4px 8px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Project Management MVP Backend</h1>
      <p>This backend scaffold is serving static content and an example API route.</p>
      <p>Verify the API using <code>/api/hello</code> or <code>/api/health</code>.</p>
      <p>Once the frontend is integrated, the app will serve the built site from this backend.</p>
    </main>
  </body>
</html>
